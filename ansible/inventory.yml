# Inventário para execuções MANUAIS (ansible-playbook -i ansible/inventory.yml ...).
# Durante o "vagrant up" o Vagrant usa o próprio inventário gerado automaticamente.
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_key
  children:
    arq:
      hosts:
        arq:
          ansible_host: 192.168.56.178
    db:
      hosts:
        db:
          ansible_host: 192.168.56.121
    app:
      hosts:
        app:
          ansible_host: 192.168.56.171
    cli:
      hosts:
        cli:
          # IP vem do DHCP (faixa 50-100). Descubra com:
          #   vagrant ssh cli -c "ip -4 -br a show eth1"
          ansible_host: 192.168.56.50
